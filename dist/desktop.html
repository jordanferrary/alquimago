<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Alquimago · Familiar Arcano</title>
  <style>
    :root { color-scheme: dark; }
    html,body { padding:0; margin:0; overflow:hidden; width:100%; height:100%; background:transparent; }
    .drag-zone { height:25px;position:absolute;top:0;left:0;right:0;z-index:3;cursor:grab; }
    #alquimago-desktop { height:100%; width:100%; overflow:hidden; }
    .close { position:fixed;top:8px;right:12px;z-index:1000;color:#ead7ff;background:#422455bb;border:1px solid #9f76ba;border-radius:9px;cursor:pointer;padding:4px 9px; }
    .close:focus-visible { outline:2px solid #ffc86a; }
  </style>
</head>
<body>
  <div class="drag-zone" data-tauri-drag-region aria-label="Arrastar janela"></div>
  <button class="close" id="close" aria-label="Fechar Alquimago">×</button>
  <div id="alquimago-desktop"></div>
  <script defer src="./alquimago.js"></script>
  <script defer src="./desktop.js"></script>
</body>
</html>
