name: Verify Alquimago cognition and browser bundle
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and behavior tests
        run: npm test
      - name: Build browser distribution
        run: npm run build
      - name: Verify offline demo uses the exact current widget
        run: npm run test:offline
      - name: Confirm standalone demo and distribution are committed in sync
        run: git diff --exit-code -- Alquimago_Demo_Offline.html dist/Alquimago_Demo_Offline.html dist/alquimago.js dist/index.html
      - name: Verify bundled JavaScript syntax
        run: node --check dist/alquimago.js
