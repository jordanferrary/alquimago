name: Compilar Alquimago para Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Alquimago-Windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
